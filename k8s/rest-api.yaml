apiVersion: v1
kind: Service
metadata:
  name: rest-api
  namespace: nexusc2
spec:
  type: NodePort
  selector:
    app: rest-api
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30843
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api
  namespace: nexusc2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest-api
  template:
    metadata:
      labels:
        app: rest-api
    spec:
      securityContext:
        supplementalGroups: [113]
      containers:
        - name: rest-api
          image: us-central1-docker.pkg.dev/ebpf-509618/nexusc2/rest-api:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
          env:
            - name: CONFIG_FILE
              value: "/app/config.toml"
            - name: HOST_PAYLOADS_PATH
              value: "/opt/nexusc2/payloads"
            - name: HOST_SHARED_PATH
              value: "/opt/nexusc2/shared"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command: ["/bin/sh", "-c"]
          args:
            - |
              export GRPC_ADDRESS="${NODE_IP}:50051"
              exec /app/rest-api-service
            - name: WS_PROXY_URL
              value: "wss://websocket.nexusc2.svc.cluster.local:3131/ws"
          envFrom:
            - secretRef:
                name: db-secrets
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: downloads
              mountPath: /app/downloads
            - name: uploads
              mountPath: /app/uploads
            - name: temp
              mountPath: /app/temp
            - name: logs
              mountPath: /app/logs
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: payloads
              mountPath: /opt/nexusc2/payloads
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
      volumes:
        - name: shared
          hostPath:
            path: /opt/nexusc2/shared
            type: DirectoryOrCreate
        - name: downloads
          emptyDir: {}
        - name: uploads
          emptyDir: {}
        - name: temp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: payloads
          hostPath:
            path: /opt/nexusc2/payloads
            type: DirectoryOrCreate
