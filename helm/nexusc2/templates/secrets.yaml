{{- $secret := lookup "v1" "Secret" .Release.Namespace "db-secrets" }}
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nexusc2.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $secret }}
  POSTGRES_PASSWORD: {{ index $secret.data "POSTGRES_PASSWORD" | b64dec | quote }}
  DB_PASSWORD: {{ index $secret.data "DB_PASSWORD" | b64dec | quote }}
  API_PASSWORD: {{ index $secret.data "API_PASSWORD" | b64dec | quote }}
  JWT_SECRET: {{ index $secret.data "JWT_SECRET" | b64dec | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | quote }}
  DB_PASSWORD: {{ randAlphaNum 32 | quote }}
  API_PASSWORD: {{ randAlphaNum 32 | quote }}
  JWT_SECRET: {{ randAlphaNum 64 | quote }}
  {{- end }}
