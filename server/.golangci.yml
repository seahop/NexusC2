version: "2"

output:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  disable:
    - errcheck
  exclusions:
    rules:
      - path: "docker/payloads/"
        linters:
          - unused
          - staticcheck
          - ineffassign
          - govet
      - path: "internal/templates/"
        linters:
          - unused
          - staticcheck
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF1003"
        - "-QF1008"
        - "-QF1011"
        - "-QF1012"
        - "-ST1000"
